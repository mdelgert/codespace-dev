version: '3.8'

services:
  backend:
    build:
      context: ./BackEnd
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    networks:
      - appnet

  frontend:
    build:
      context: ./FrontEnd
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - WEATHER_URL=http://backend:8080
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
